name: Bulk Fund Parser & Matcher Tests

on:
  push:
    paths:
      - "src/lib/bulkFundParser.ts"
      - "src/lib/bulkFundMatcher.ts"
      - "src/lib/bulkFundAutoRemap.ts"
      - "src/lib/bulkFund*.test.ts"
      - "src/lib/__fixtures__/bulkFundSample.ts"
      - "src/lib/__snapshots__/**"
      - ".github/workflows/bulk-fund-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
  pull_request:
    paths:
      - "src/lib/bulkFundParser.ts"
      - "src/lib/bulkFundMatcher.ts"
      - "src/lib/bulkFundAutoRemap.ts"
      - "src/lib/bulkFund*.test.ts"
      - "src/lib/__fixtures__/bulkFundSample.ts"
      - "src/lib/__snapshots__/**"

jobs:
  bulk-fund-tests:
    name: Run bulkFund parser + matcher suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bulkFund tests (kind + drift stability + auto-remap dedupe gate)
        run: |
          npx vitest run \
            src/lib/bulkFundParser.malformed.test.ts \
            src/lib/bulkFundMatcher.test.ts \
            src/lib/bulkFundMatcher.e2e.test.ts \
            src/lib/bulkFundMatcher.snapshot.test.ts \
            src/lib/bulkFundAutoRemap.test.ts \
            --reporter=verbose
        env:
          CI: true
