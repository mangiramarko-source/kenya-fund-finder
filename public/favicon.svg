<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="kff-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="kff-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="kff-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle with rich emerald-to-mint gradient -->
  <rect width="32" height="32" rx="8" fill="url(#kff-grad)" />

  <!-- Subtle inner top-left highlight border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />

  <!-- Gradient fill area under market trend line -->
  <path d="M 7 21 L 13 14 L 17 18 L 24 10 L 24 24 L 7 24 Z" fill="url(#kff-area)" />

  <!-- Crisp upward market arrow with shadow -->
  <g filter="url(#kff-glow)">
    <polyline points="7 21 13 14 17 18 24 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="19 10 24 10 24 15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
