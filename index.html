      <script>
        // After 8s with no React mount, escalate the fallback message and show retry actions.
        window.__kffBootTimer = setTimeout(function(){
          var msg = document.getElementById('kff-boot-msg');
          var actions = document.getElementById('kff-boot-actions');
          var spinner = document.getElementById('kff-boot-spinner');
          if (msg) msg.textContent = "We're having trouble loading the site. This may be a temporary network issue.";
          if (actions) actions.style.display = 'flex';
          if (spinner) spinner.style.display = 'none';
        }, 8000);
