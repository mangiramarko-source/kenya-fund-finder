            Kenya Fund Finder

          <h1 style="font-family:'DM Sans',system-ui,sans-serif;font-size:18px;font-weight:600;margin:0 0 8px;">Loading market data…</h1>
          <p id="kff-boot-msg" style="font-size:13px;color:#94a3b8;margin:0 0 20px;line-height:1.5;">
            Connecting to live feeds. If this takes more than a few seconds, please check your connection.

            <button onclick="window.location.reload()" style="background:#22c55e;color:#0b0f1a;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;">Retry</button>
            <a href="/" style="background:transparent;color:#e6edf7;border:1px solid rgba(230,237,247,.2);border-radius:8px;padding:10px 16px;font-weight:500;font-size:13px;text-decoration:none;font-family:inherit;">Go home</a>
          </div>
          <p style="font-size:11px;color:#64748b;margin-top:24px;">A product of <a href="https://elyon.ltd" style="color:#94a3b8;text-decoration:none;">Elyon.ltd</a></p>
        </div>
      </div>
      <style>@keyframes kffspin{to{transform:rotate(360deg)}}</style>
      <script>
        // After 8s with no React mount, escalate the fallback message and show retry actions.
        window.__kffBootTimer = setTimeout(function(){
          var msg = document.getElementById('kff-boot-msg');
          var actions = document.getElementById('kff-boot-actions');
          var spinner = document.getElementById('kff-boot-spinner');
          if (msg) msg.textContent = "We're having trouble loading the site. This may be a temporary network issue.";
          if (actions) actions.style.display = 'flex';
          if (spinner) spinner.style.display = 'none';
        }, 8000);
      </script>
